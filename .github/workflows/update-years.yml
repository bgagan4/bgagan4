name: Update years of experience

on:
  schedule:
    - cron: '0 3 1 * *' # 03:00 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write

env:
  CAREER_START_YEAR: '2014'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recalculate years of experience
        run: |
          YEARS=$(( $(date -u +%Y) - CAREER_START_YEAR ))
          sed -i "s|<!--YEARS-->[0-9]*<!--/YEARS-->|<!--YEARS-->${YEARS}<!--/YEARS-->|" README.md

      - name: Commit if changed
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update years of experience" README.md
            git push
          fi
