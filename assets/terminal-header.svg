<svg xmlns="http://www.w3.org/2000/svg" width="800" height="230" viewBox="0 0 800 230" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <clipPath id="type1"><rect x="24" y="52" height="20" width="0"><animate attributeName="width" from="0" to="230" begin="0.6s" dur="1.1s" calcMode="discrete" values="0;10;21;31;42;52;63;73;84;94;105;115;126;136;147;157;168;178;189;199;210;220;230" fill="freeze"/></rect></clipPath>
    <clipPath id="type2"><rect x="24" y="104" height="20" width="0"><animate attributeName="width" from="0" to="300" begin="2.6s" dur="1.2s" calcMode="discrete" values="0;12;24;36;48;60;72;84;96;108;120;132;144;156;168;180;192;204;216;228;240;252;264;276;288;300" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- terminal window -->
  <rect x="0.5" y="0.5" width="799" height="229" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="799" height="32" rx="10" fill="#161b22" stroke="#30363d"/>
  <rect x="0.5" y="24" width="799" height="9" fill="#161b22"/>
  <circle cx="24" cy="16.5" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="16.5" r="6" fill="#febc2e"/>
  <circle cx="68" cy="16.5" r="6" fill="#28c840"/>
  <text x="400" y="21" text-anchor="middle" fill="#8b949e" font-size="13">gagan@github: ~</text>

  <!-- line 1: whoami -->
  <g clip-path="url(#type1)">
    <text x="24" y="68" font-size="16"><tspan fill="#7ee787">gagan@github</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#79c0ff">~</tspan><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">whoami</tspan></text>
  </g>
  <text x="24" y="94" font-size="16" fill="#e6edf3" opacity="0">Gagan Bodduluru <tspan fill="#8b949e">// Software Engineer @ Flagstone International</tspan><set attributeName="opacity" to="1" begin="2.0s" fill="freeze"/></text>

  <!-- line 2: stack -->
  <g clip-path="url(#type2)">
    <text x="24" y="120" font-size="16"><tspan fill="#7ee787">gagan@github</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#79c0ff">~</tspan><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">cat stack.txt</tspan></text>
  </g>
  <text x="24" y="146" font-size="16" fill="#ffa657" opacity="0">.NET | C# | TypeScript | Angular | React<set attributeName="opacity" to="1" begin="4.1s" fill="freeze"/></text>
  <text x="24" y="170" font-size="16" fill="#ffa657" opacity="0">Azure | AWS | GCP<set attributeName="opacity" to="1" begin="4.4s" fill="freeze"/></text>

  <!-- final prompt with blinking cursor -->
  <text x="24" y="202" font-size="16" opacity="0"><tspan fill="#7ee787">gagan@github</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#79c0ff">~</tspan><tspan fill="#8b949e">$ </tspan><set attributeName="opacity" to="1" begin="4.9s" fill="freeze"/></text>
  <rect x="180" y="189" width="9" height="16" fill="#e6edf3" opacity="0">
    <set attributeName="opacity" to="1" begin="4.9s"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" begin="4.9s" repeatCount="indefinite"/>
  </rect>
</svg>
